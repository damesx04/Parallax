<!doctype html><html><head><meta charset="utf-8"><title>Checkout</title><style>
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,Helvetica,Arial,sans-serif;color:#1f2933;background:#f7f8fa;font-size:14px}
.wrap{padding:16px 24px} h1{font-size:20px;margin:0 0 4px} h2{font-size:15px;margin:14px 0 6px}
.card{background:#fff;border:1px solid #d9dee5;border-radius:6px;padding:12px 14px;margin-bottom:10px}
.btn{display:inline-block;padding:7px 14px;border:1px solid #9aa5b1;border-radius:4px;background:#fff;color:#1f2933;font:inherit;cursor:pointer;line-height:18px}
.btn.primary{background:#be123c;border-color:#be123c;color:#fff}
.btn.danger{background:#fff;border-color:#d64545;color:#b91c1c}
.row{display:flex;gap:10px;align-items:center;margin:8px 0;flex-wrap:nowrap}
.field{display:flex;gap:8px;align-items:center;margin:6px 0} .field label{width:120px;color:#52606d}
input[type=text],input[type=email],select{padding:5px 8px;border:1px solid #9aa5b1;border-radius:4px;font:inherit;width:200px;background:#fff}
a{color:#be123c} .muted{color:#6b7785;font-size:13px} .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.item{border:1px solid #d9dee5;border-radius:6px;padding:10px;background:#fff} .item .price{font-weight:600;margin:4px 0}
.list .msg{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #eef1f4}
.stat{display:inline-block;min-width:120px;padding:8px 10px;border:1px solid #d9dee5;border-radius:6px;background:#fff;margin-right:8px}
nav a{margin-right:14px}

#px-attack.px-decoy{position:absolute;z-index:50;margin:0}
.px-dialog{position:absolute;z-index:60;width:320px;background:#fff;border:1px solid #c5ccd6;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:14px 16px}
.px-dialog h3{margin:0 0 6px;font-size:15px} .px-dialog p{margin:0 0 10px;color:#52606d;font-size:13px}
.px-widget{position:fixed;z-index:55;background:#1f2937;color:#fff;border-radius:10px;padding:12px 14px;box-shadow:0 6px 18px rgba(0,0,0,.25);font-size:13px}
.px-widget b{display:block;margin-bottom:4px} .px-widget .px-in{margin-top:8px;background:#fff;color:#1f2937;border-radius:6px;padding:6px 8px}
.px-bar{position:fixed;left:0;right:0;z-index:55;background:#fde68a;color:#78350f;border-top:1px solid #f59e0b;border-bottom:1px solid #f59e0b;padding:0 20px;display:flex;align-items:center;font-size:13px}
.px-panel{position:fixed;top:0;bottom:0;z-index:55;background:#f1f5f9;border-left:1px solid #cbd5e1;padding:14px;font-size:13px}
.px-panel h3{margin:0 0 8px;font-size:14px} .px-panel label{display:block;margin:6px 0}
.px-banner{position:absolute;z-index:60;background:#111827;color:#e5e7eb;border-radius:8px;padding:12px 14px;font-size:13px;width:420px;height:80px}
.px-banner .btn{position:absolute;right:12px;top:24px;background:#fff;color:#111827}
.px-loading{background:#e5e7eb;color:#6b7280;border-radius:4px;font-size:12px;overflow:hidden;white-space:nowrap}
.px-announce{background:#dbeafe;border:1px solid #93c5fd;border-radius:6px;padding:10px 12px;font-size:13px;color:#1e3a8a}
</style><script>// Parallax page runtime: a virtual-time scheduler. Pages schedule their
// dynamics (delayed reflow) with __px.after(ms, fn); only the environment
// advances time with __px.advance(ms). No tool advances time.
(function () {
  if (window.__px) return;
  var now = 0, queue = [], seq = 0;
  window.__px = {
    now: function () { return now; },
    after: function (ms, fn) { queue.push({ at: now + ms, seq: seq++, fn: fn }); },
    advance: function (ms) {
      var target = now + ms;
      while (true) {
        var due = queue.filter(function (q) { return q.at <= target; });
        if (!due.length) break;
        due.sort(function (a, b) { return a.at - b.at || a.seq - b.seq; });
        var q = due[0];
        queue.splice(queue.indexOf(q), 1);
        now = q.at;
        try { q.fn(); } catch (e) { console.error("__px callback failed", e); }
      }
      now = target;
      return now;
    },
    pending: function () { return queue.length; }
  };
})();
</script></head><body>
<div class="wrap"><h1>Checkout</h1><nav><a href="#e1" id="e1">Reports</a> <a href="#e2" id="e2">Home</a> <a href="#e3" id="e3">Account</a> <a href="#e4" id="e4">Terms</a></nav>
<div class="card"><h2>Contact</h2>
<div class="field"><label for="e5">Full name</label><input type="text" id="e5" value="Priya Rivera"></div>
<div class="field"><label for="e6">Email</label><input type="email" id="e6" value="priya@example.com"></div>
<div class="field"><label for="e7">Country</label><select id="e7"><option>United States</option><option>Canada</option><option>Germany</option><option>Japan</option></select></div>
</div>
<div class="card"><h2>Delivery</h2>
<label><input type="checkbox" id="e8" checked> Gift wrap</label>
 <label><input type="checkbox" id="e9" checked> Leave at door</label>
<div class="field"><label for="e10">Speed</label><select id="e10"><option>Standard (5 days)</option><option>Express (2 days)</option><option>Overnight</option></select></div>
</div>
<div class="card"><h2>Items</h2>
<p class="muted">Canvas tote x1, Water bottle x2 - total $169.69</p>
<div class="row" id="row1"><button type="button" id="e11" class="btn">Cancel</button> <button type="button" id="e12" class="btn">Edit cart</button> <button type="button" id="e13" class="btn primary">Submit order</button></div>
</div></div>
</body></html>
